name: Reviewed checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Exact reviewed base commit for change selection
        required: true
        type: string
      authorization_sha256:
        description: Optional exact checksum of a source-bound full closeout authorization
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      standard: ${{ steps.plan.outputs.standard }}
      root: ${{ steps.plan.outputs.root }}
      go: ${{ steps.plan.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - name: Scan source and complete Git objects
        run: node scripts/reviewed-history.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-security
          path: .work/*security*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Select reviewed changes or source-bound full closeout
        id: plan
        env:
          HARNESS_CI_BASE: ${{ inputs.base_commit }}
          HARNESS_AUTHORIZATION_SHA: ${{ inputs.authorization_sha256 }}
        run: node scripts/ci-checks.mjs plan .work/ci-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: .work/ci-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  standard:
    needs: plan
    if: needs.plan.outputs.standard == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            package: 0.164.0-linux-x64
          - os: windows-2025
            target: windows
            package: 0.164.0-win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: .work
      - name: Install pinned dependencies and build the actual modules
        run: |
          npm install --global pnpm@11.22.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm build
      - name: Prepare independent official CLI
        env:
          CODEX_PACKAGE_VERSION: ${{ matrix.package }}
        run: |
          mkdir -p reference/runtime/ci-codex
          npm pack "@openai/codex@$CODEX_PACKAGE_VERSION" --registry=https://registry.npmjs.org --pack-destination reference/runtime/ci-codex --json > reference/runtime/ci-codex/pack.json
          node scripts/prepare-ci-native.mjs
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a",encoding="utf-8").write("HARNESS_TEST_PYTHON="+sys.executable+"\n")'
      - name: Prepare pinned Go and authenticated public modules
        if: needs.plan.outputs.go == 'true'
        run: python -B scripts/prepare-ci-go.py
      - name: Verify isolated Windows process controllers before native tests
        if: runner.os == 'Windows'
        run: node scripts/windows-controller-preflight.mjs .work/windows-controller-preflight.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: windows-controller-preflight
          path: .work/windows-controller-preflight.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run exact selection and retain platform skips for reconciliation
        env:
          CI_TARGET: ${{ matrix.target }}
        run: |
          code=0
          node scripts/ci-checks.mjs "$CI_TARGET" .work/ci-plan.json ".work/result-$CI_TARGET.json" || code=$?
          test "$code" -eq 0 -o "$code" -eq 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cases-${{ matrix.target }}
          path: .work/result-${{ matrix.target }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  root_deploy:
    needs: plan
    if: needs.plan.outputs.root == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: .work
      - name: Build actual Ledger as the unprivileged runner
        run: |
          npm install --global pnpm@11.22.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:server
      - name: Run root fixtures only on the disposable hosted runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          source_root="$(pwd -P)"
          test "$source_root" = "$(realpath "$GITHUB_WORKSPACE")"
          root_checkout="$(mktemp -d /tmp/harness-ci-root-source.XXXXXX)"
          /usr/bin/sudo -n -- /usr/bin/chown 0:0 "$root_checkout"
          /usr/bin/sudo -n -- /usr/bin/chmod 0755 "$root_checkout"
          # Reconstruct only reviewed tracked source, then add its Git metadata,
          # built modules/dependencies and exact plan. Runner homes, npm caches
          # and unrelated ignored workspaces are never copied into the fixture.
          git -C "$source_root" archive --format=tar HEAD | /usr/bin/sudo -n -- /usr/bin/tar --no-same-owner -xf - -C "$root_checkout"
          for entry in .git node_modules dist; do
            test -d "$source_root/$entry" && test ! -L "$source_root/$entry"
            /usr/bin/sudo -n -- /usr/bin/cp -a --no-preserve=ownership -- "$source_root/$entry" "$root_checkout/$entry"
          done
          /usr/bin/sudo -n -- /usr/bin/mkdir -m 0755 "$root_checkout/.work"
          /usr/bin/sudo -n -- /usr/bin/cp --no-preserve=ownership -- "$source_root/.work/ci-plan.json" "$root_checkout/.work/ci-plan.json"
          node_bin="$(command -v node)"
          cd "$root_checkout"
          code=0
          /usr/bin/sudo -n -- /usr/bin/env -i PATH="$(dirname "$node_bin"):/usr/bin:/bin" HARNESS_TEST_NODE="$node_bin" HARNESS_TEST_PYTHON=/usr/bin/python3 "$node_bin" scripts/ci-checks.mjs linux-root .work/ci-plan.json .work/result-linux-root.json || code=$?
          # A failed test still publishes its report. A missing report remains
          # an error and can never be reclassified as an accepted platform skip.
          /usr/bin/sudo -n -- /usr/bin/install -m 0644 "$root_checkout/.work/result-linux-root.json" "$source_root/.work/result-linux-root.json"
          test "$code" -eq 0 -o "$code" -eq 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cases-linux-root
          path: .work/result-linux-root.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Verified case coverage
    needs: [plan, standard, root_deploy]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: .work/ci-results
          merge-multiple: true
      - name: Require all identities and complement every skipped case
        run: node scripts/ci-checks.mjs reconcile .work/ci-results/ci-plan.json .work/ci-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-coverage
          path: .work/ci-results/reconciled.json
          include-hidden-files: true
          if-no-files-found: error
