name: Affected checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: affected-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      native: ${{ steps.plan.outputs.native }}
      root_deploy: ${{ steps.plan.outputs.root_deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Scan the release source inventory
        run: node scripts/release-audit.mjs --source
      - name: Install pinned project dependencies
        run: |
          npm install --global pnpm@11.22.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Type and build checks
        run: |
          pnpm typecheck
          pnpm build
      - name: Select affected tests
        id: plan
        shell: bash
        run: |
          mkdir -p .work
          node scripts/select-tests.mjs --base "$CHANGE_BASE" --head "$CHANGE_HEAD" > .work/ci-plan.json
          cat .work/ci-plan.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync(".work/ci-plan.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `native=${p.groups.native.length > 0}\nroot_deploy=${JSON.stringify(p.groups["deploy-root"])}\n`);'
      - name: Run affected JavaScript tests
        run: node scripts/select-tests.mjs --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --run unit
      - name: Run affected unprivileged Python deployment tests
        run: node scripts/select-tests.mjs --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --run deploy

  root_deploy:
    needs: affected
    if: needs.affected.outputs.root_deploy != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SELECTED_ROOT_FILES: ${{ needs.affected.outputs.root_deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run selected root ownership fixtures on the disposable runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          mkdir -p .work
          /usr/bin/python3 -I -c 'import os,pathlib; pathlib.Path(".work/ci-root-deploy.json").write_text(os.environ["SELECTED_ROOT_FILES"],encoding="utf-8")'
          /usr/bin/sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B - <<'PY'
          import importlib.util, json, os, re, sys, tempfile, unittest
          from pathlib import Path
          if sys.platform != "linux" or os.geteuid() != 0:
              raise RuntimeError("Root ownership fixtures require Linux root")
          root = Path.cwd().resolve()
          selection = (root / ".work/ci-root-deploy.json").read_bytes()
          if len(selection) > 32768:
              raise RuntimeError("Root test selection exceeds its bound")
          files = json.loads(selection)
          if not isinstance(files, list) or not 1 <= len(files) <= 128 or any(not isinstance(name, str) for name in files) or len(set(files)) != len(files):
              raise RuntimeError("Expected exact nonempty unique selected test files")
          for name in files:
              if not re.fullmatch(r"tests/deploy/root/test_[a-z0-9_]+\.py", name):
                  raise RuntimeError("Selection contains a non-root-fixture path")
              current = root
              parts = Path(name).parts
              for index, part in enumerate(parts):
                  current /= part
                  if current.is_symlink() or not (current.is_file() if index == len(parts) - 1 else current.is_dir()):
                      raise RuntimeError("Selected test must be an ordinary repository file")
          sys.path.insert(0, str(root))
          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix="root-fixture-home-", dir=root / ".work") as home:
              os.environ.update(HOME=home, PYTHONDONTWRITEBYTECODE="1")
              suite = unittest.TestSuite()
              for index, name in enumerate(files):
                  spec = importlib.util.spec_from_file_location("selected_root_" + str(index), root / name)
                  module = importlib.util.module_from_spec(spec)
                  sys.modules[spec.name] = module
                  spec.loader.exec_module(module)
                  selected = unittest.defaultTestLoader.loadTestsFromModule(module)
                  if not selected.countTestCases():
                      raise RuntimeError("Selected root fixture contains no tests")
                  suite.addTests(selected)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(1 if not result.wasSuccessful() else 3 if result.skipped else 0)
          PY

  native:
    needs: affected
    if: needs.affected.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: 0.164.0-linux-x64
            integrity: sha512-XLAoaWsGOT2khzl+P4FYDPTkzAr9W0VFXFaVkqlFdkM0soa1gH/4S0wSD57Ek3HHwkirAEGz2/Mwehseh+l5Mg==
          - os: windows-2025
            package: 0.164.0-win32-x64
            integrity: sha512-urWPhwh9YavuoAPIkmVYKBTtd5OtGVL4Ki0Fb28dhK/Mz6Pt4LSy+gbRrZFz5+RXrw9ubvXuXDCcd8beYcWhDg==
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CODEX_PACKAGE_VERSION: ${{ matrix.package }}
      CODEX_PACKAGE_INTEGRITY: ${{ matrix.integrity }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Install pinned project dependencies
        run: |
          npm install --global pnpm@11.22.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Prepare independent official CLI 0.164.0
        run: |
          mkdir -p reference/runtime/ci-codex
          npm pack "@openai/codex@$CODEX_PACKAGE_VERSION" --registry=https://registry.npmjs.org --pack-destination reference/runtime/ci-codex --json > reference/runtime/ci-codex/pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const root = path.resolve('reference/runtime/ci-codex');
          const [entry] = JSON.parse(fs.readFileSync(path.join(root, 'pack.json'), 'utf8'));
          if (entry.name !== '@openai/codex' || entry.version !== process.env.CODEX_PACKAGE_VERSION || entry.integrity !== process.env.CODEX_PACKAGE_INTEGRITY || !/^codex-[A-Za-z0-9.-]+\.tgz$/.test(entry.filename)) throw Error('Official package metadata mismatch');
          const archive = path.join(root, entry.filename);
          const integrity = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(archive)).digest('base64');
          if (integrity !== process.env.CODEX_PACKAGE_INTEGRITY) throw Error('Official package integrity mismatch');
          execFileSync('tar', ['-xzf', archive, '-C', root], { stdio: 'inherit', windowsHide: true });
          const binaries = [];
          function walk(folder) { for (const item of fs.readdirSync(folder, { withFileTypes: true })) { const file=path.join(folder,item.name); if(item.isDirectory()) walk(file); else if(item.isFile() && item.name === (process.platform === 'win32' ? 'codex.exe' : 'codex')) binaries.push(file); } }
          walk(path.join(root, 'package', 'vendor'));
          if (binaries.length !== 1) throw Error('Expected one independent native binary');
          fs.appendFileSync(process.env.GITHUB_ENV, `HARNESS_TEST_CODEX_BIN=${binaries[0]}\n`);
          NODE
      - name: Run affected native tests with the independent CLI
        run: node scripts/select-tests.mjs --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --run native
