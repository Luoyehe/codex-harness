name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_closeout:
        description: "Confirm this commit has passed three consecutive complete audits without new findings before running full tests"
        type: boolean
        default: false
      base_commit:
        description: "Base commit SHA for targeted checks (required unless audit_closeout is confirmed)"
        type: string
        required: false
      reviewed_test_files:
        description: "Reviewed comma-separated test paths for dependency/config changes without an automatic mapping"
        type: string
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The object audit below is a history audit, not another current-tree
          # scan. A shallow checkout would silently narrow that contract.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Runtime prerequisites
        run: |
          python3 -c 'import sys,tomllib; assert sys.version_info >= (3, 11)'
          shellcheck --version

      - name: Reject CRLF in executable/config sources
        shell: bash
        run: |
          set -euo pipefail
          if git grep -Il $'\r$' -- '*.sh' '*.mjs' '*.yml' '*.yaml'; then
            echo 'CRLF line endings found; repository scripts must use LF' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo 'CRLF check could not inspect the Git tree' >&2
              exit "$status"
            fi
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Python syntax
        run: >-
          python3 -c 'import ast,pathlib;
          [ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for root in ("deploy", "scripts")
          for path in pathlib.Path(root).rglob("*.py")]'

      - name: Build
        run: pnpm build

      - name: Targeted tests (ordinary edits)
        if: github.event_name != 'workflow_dispatch' || inputs.audit_closeout != true
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_commit }}
          TEST_REVIEWED_FILES: ${{ inputs.reviewed_test_files }}
          HARNESS_ALLOW_SYSTEMD_FIXTURE: "1"
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/targeted-test-plan.json"
          node scripts/targeted-tests.mjs --plan --reviewed-tests "$TEST_REVIEWED_FILES" --base "$TEST_BASE" > "$plan"
          cat "$plan"
          if node --input-type=module -e 'import fs from "node:fs"; const plan=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(plan.requiredNativeChecks.some(value => value.startsWith("cli-")) ? 0 : 1)' "$plan"; then
            pinned="$(sed -n 's/^CODEX_VERSION="\([^"]*\)".*/\1/p' deploy/install.sh)"
            [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            npm install --prefix "$RUNNER_TEMP/codex-targeted-runtime" --ignore-scripts --no-audit --no-fund "@openai/codex@$pinned"
            export CODEX_BIN="$RUNNER_TEMP/codex-targeted-runtime/node_modules/.bin/codex"
          fi
          node scripts/targeted-tests.mjs --reviewed-tests "$TEST_REVIEWED_FILES" --base "$TEST_BASE"

      - name: Full tests (three clean audit rounds confirmed)
        if: github.event_name == 'workflow_dispatch' && inputs.audit_closeout == true
        run: pnpm test

      - name: Built gateway terminal lifecycle (synthetic app-server)
        if: github.event_name == 'workflow_dispatch' && inputs.audit_closeout == true
        run: pnpm --filter @codex-harness/gateway exec vitest run test/terminal-ws.test.ts

      - name: Isolated app-server smoke (no model requests)
        if: github.event_name == 'workflow_dispatch' && inputs.audit_closeout == true
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^CODEX_VERSION="\([^"]*\)".*/\1/p' deploy/install.sh)"
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/codex-smoke-runtime" --ignore-scripts --no-audit --no-fund "@openai/codex@$pinned"
          CODEX_BIN="$RUNNER_TEMP/codex-smoke-runtime/node_modules/.bin/codex" pnpm test:smoke
          CODEX_BIN="$RUNNER_TEMP/codex-smoke-runtime/node_modules/.bin/codex" pnpm test:defaults
          CODEX_BIN="$RUNNER_TEMP/codex-smoke-runtime/node_modules/.bin/codex" pnpm test:mcp-context

      - name: Shell syntax (all deploy scripts)
        run: |
          set -e
          while IFS= read -r f; do bash -n "$f"; done < <(find deploy -name '*.sh')

      - name: ShellCheck
        run: find deploy scripts -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

      - name: Node syntax (all .mjs)
        run: |
          set -e
          while IFS= read -r f; do node --check "$f"; done < <(find . -name '*.mjs' -not -path './node_modules/*')

      - name: Release audit (no secrets / junk in tree)
        run: |
          node scripts/release-audit.mjs .
          bash scripts/git-object-audit.sh .

      - name: Dependency audit (moderate, high and critical)
        run: pnpm audit --audit-level moderate

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CODEX_TEST_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Runtime prerequisites
        run: python -I -c "import sys,tomllib; assert sys.version_info >= (3, 11)"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # Real Windows process/.cmd paths run here; Bash, Linux ownership/mount
      # fixtures remain explicitly platform-skipped and run in the Linux job.
      - name: Targeted tests (ordinary edits)
        if: github.event_name != 'workflow_dispatch' || inputs.audit_closeout != true
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_commit }}
          TEST_REVIEWED_FILES: ${{ inputs.reviewed_test_files }}
        run: node scripts/targeted-tests.mjs --reviewed-tests "$env:TEST_REVIEWED_FILES" --base "$env:TEST_BASE"
      - name: Full tests (three clean audit rounds confirmed, no provider calls)
        if: github.event_name == 'workflow_dispatch' && inputs.audit_closeout == true
        run: pnpm test

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
